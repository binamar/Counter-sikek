name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap web build as Android app (Capacitor)
        run: |
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '{"appId":"com.example.countersikek","appName":"Counter Sikek","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../counter-sikek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: counter-sikek-apk
          path: counter-sikek.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Counter Sikek APK ${{ github.run_number }}
          files: counter-sikek.apk
